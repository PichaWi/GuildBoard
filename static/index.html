<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuildBoard - Course Support & Activity Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>GuildBoard</h1>
            <p class="subtitle">Course Support & Activity Dashboard</p>
        </header>
        <main class="card">
            <h2>System Status</h2>
            <div id="status" class="status-indicator">Checking backend connection...</div>
            <div class="info-grid">
                <div class="info-item">
                    <span class="label">Architecture:</span>
                    <span class="value">Modular Monolith (MVC)</span>
                </div>
                <div class="info-item">
                    <span class="label">Backend:</span>
                    <span class="value">FastAPI (Python 3.10)</span>
                </div>
                <div class="info-item">
                    <span class="label">Database:</span>
                    <span class="value">PostgreSQL (Supabase)</span>
                </div>
            </div>
        </main>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
